<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>More Options</h1>
    <label class="switch" title="Turn all filters on or off">
      <input type="checkbox" data-key="enabled">
      <span></span>
    </label>
  </header>

  <section>
    <h2>Hide</h2>
    <label class="row"><span>Shorts</span><input type="checkbox" data-key="shorts"></label>
    <label class="row"><span>Playables</span><input type="checkbox" data-key="playables"></label>
    <label class="row"><span>News and Trending rows</span><input type="checkbox" data-key="news"></label>
    <label class="row"><span>Live and upcoming</span><input type="checkbox" data-key="live"></label>
    <label class="row"><span>Mixes</span><input type="checkbox" data-key="mixes"></label>
    <label class="row"><span>Playlists</span><input type="checkbox" data-key="playlists"></label>
    <div class="row select-row">
      <span>Members-only videos</span>
      <select data-key="membersMode" aria-label="Members-only videos">
        <option value="always">Always hide</option>
        <option value="unlessSubscribed">Hide unless subscribed</option>
        <option value="never">Show</option>
      </select>
    </div>
  </section>

  <section>
    <h2>Rules</h2>
    <div class="rule">
      <label class="row"><span>No older than</span><input type="checkbox" data-key="maxAge"></label>
      <div class="inputs">
        <input type="number" min="1" data-key="maxAgeValue" aria-label="Age">
        <select data-key="maxAgeUnit" aria-label="Unit">
          <option value="days">days</option>
          <option value="weeks">weeks</option>
          <option value="months">months</option>
          <option value="years">years</option>
        </select>
      </div>
    </div>
    <div class="rule">
      <label class="row"><span>No fewer views than</span><input type="checkbox" data-key="minViews"></label>
      <div class="inputs">
        <input type="number" min="0" step="100" data-key="minViewsValue" aria-label="Views"><span>views</span>
      </div>
    </div>
    <div class="rule">
      <label class="row"><span>No more watch time than</span><input type="checkbox" data-key="watched"></label>
      <div class="inputs">
        <input type="number" min="1" max="100" data-key="watchedPct" aria-label="Percent watched"><span>% watched</span>
      </div>
    </div>
    <label class="row"><span>Also on Search, Subscriptions and the video sidebar</span><input type="checkbox" data-key="everywhere"></label>
  </section>

  <section>
    <h2>Grid</h2>
    <div class="rule">
      <label class="row"><span>Videos per row</span><input type="checkbox" data-key="perRow"></label>
      <div class="inputs">
        <input type="number" min="1" max="8" data-key="perRowValue" aria-label="Videos per row"><span>per row</span>
      </div>
    </div>
    <label class="row"><span>Hide titles</span><input type="checkbox" data-key="hideTitles"></label>
    <label class="row"><span>Hide channel names</span><input type="checkbox" data-key="hideChannels"></label>
    <label class="row"><span>Hide channel icons</span><input type="checkbox" data-key="hideAvatars"></label>
    <label class="row"><span>Hide views, dates and likes</span><input type="checkbox" data-key="hideMeta"></label>
  </section>

  <section>
    <h2>Playback</h2>
    <label class="row"><span>No previews on hover</span><input type="checkbox" data-key="noPreview"></label>
    <label class="row"><span>Autoplay skips watched and repeats</span><input type="checkbox" data-key="smartAutoplay"></label>
    <div class="rule">
      <label class="row"><span>Start at speed</span><input type="checkbox" data-key="speed"></label>
      <div class="inputs">
        <select data-key="speedValue" aria-label="Speed">
          <option value="1">1x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="1.75">1.75x</option>
          <option value="2">2x</option>
        </select>
      </div>
    </div>
    <div class="rule">
      <label class="row"><span>Start at quality</span><input type="checkbox" data-key="quality"></label>
      <div class="inputs">
        <select data-key="qualityValue" aria-label="Quality">
          <option value="highest">Highest</option>
          <option value="2160">4K</option>
          <option value="1440">1440p</option>
          <option value="1080">1080p</option>
          <option value="720">720p</option>
          <option value="480">480p</option>
        </select>
      </div>
    </div>
    <label class="row"><span>Theater mode</span><input type="checkbox" data-key="theater"></label>
    <label class="row"><span>Open Shorts in the normal player</span><input type="checkbox" data-key="shortsAsVideo"></label>
    <label class="row"><span>Hide end cards</span><input type="checkbox" data-key="noEndCards"></label>
    <label class="row"><span>Hide comments</span><input type="checkbox" data-key="noComments"></label>
    <div class="row select-row">
      <span>Subtitles</span>
      <select data-key="subtitles" aria-label="Subtitles">
        <option value="default">YouTube decides</option>
        <option value="off">Always off</option>
        <option value="no">Always Norwegian</option>
        <option value="en">Always English</option>
      </select>
    </div>
  </section>

  <section>
    <h2>Block</h2>
    <label class="field">
      <span>Channels, one per line</span>
      <textarea data-key="blockChannels" rows="3" spellcheck="false" placeholder="Channel name or @handle"></textarea>
    </label>
    <label class="field">
      <span>Words in titles, one per line</span>
      <textarea data-key="blockWords" rows="3" spellcheck="false" placeholder="e.g. reaction"></textarea>
    </label>
  </section>

  <footer id="stats" hidden></footer>
  <script src="../src/parse.js"></script>
  <script src="popup.js"></script>
</body>
</html>
